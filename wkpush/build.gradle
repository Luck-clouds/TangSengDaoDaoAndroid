plugins {
    id 'com.android.library'
    id 'kotlin-parcelize'
    id 'kotlin-android'
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.chat.push'

    sourceSets {
        main {
            // HUAWEI 分支只编译华为回调，继续排除其他厂商实现及其 SDK 引用。
            java.exclude 'com/chat/push/push/HonorPushMessageService.java'
            java.exclude 'com/chat/push/push/OPPOAppPushMessageService.java'
            java.exclude 'com/chat/push/push/OPPOPushMessageService.java'
            java.exclude 'com/chat/push/push/VivoPushMessageReceiverImpl.java'
            java.exclude 'com/chat/push/push/WKFirebaseMessagingService.java'
            java.exclude 'com/chat/push/push/XiaoMiMessageReceiver.java'
        }
    }
}

dependencies {
    api project(':wkbase')
    implementation 'com.huawei.agconnect:agconnect-core:1.9.6.300'
    implementation 'com.huawei.hms:push:6.13.0.301'
    // 缺少 HMS Core（APK）时提供官方安装/升级引导。
    implementation 'com.huawei.hms:hmscoreinstaller:6.13.0.304'
}

